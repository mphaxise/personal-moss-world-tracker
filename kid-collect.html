<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kid Challenge Mode</title>
    <link rel="stylesheet" href="challenge.css" />
  </head>
  <body>
    <div class="challenge-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Kid mode</p>
          <h1 id="pageTitle">Loading challenge</h1>
          <p class="hero-text" id="heroText">Loading the selected challenge pack.</p>
        </div>
        <div class="hero-actions">
          <button type="button" id="nextBtn" class="primary-btn">Next card</button>
          <button type="button" id="exportBtn" class="ghost-btn">Export kid notes</button>
          <button type="button" id="uploadBtn" class="ghost-btn">Upload to laptop</button>
          <button type="button" id="offlineBtn" class="ghost-btn">Prepare offline</button>
          <a id="adultLink" class="ghost-link" href="collect.html">Open adult mode</a>
          <a id="pickerLink" class="ghost-link" href="index.html">Open challenge picker</a>
          <a id="atlasLink" class="ghost-link" href="atlas.html">Open legacy atlas</a>
        </div>
      </header>

      <main class="layout-grid kid-layout">
        <section class="panel">
          <div class="section-head">
            <p class="section-label">Challenge track</p>
            <h2>Card progress</h2>
          </div>
          <div class="progress-row" id="progressRow"></div>
          <div class="meta-row" id="packMeta"></div>
          <div class="card-rail" id="cardRail"></div>
        </section>

        <section class="panel">
          <div class="section-head">
            <p class="section-label">Current card</p>
            <h2>One card at a time</h2>
          </div>
          <div id="activeCard" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="register-offline.js"></script>
    <script type="module" src="challenge-kid.js"></script>
  </body>
</html>
