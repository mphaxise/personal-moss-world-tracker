<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neighborhood Nature Challenges</title>
    <link rel="stylesheet" href="challenge.css" />
  </head>
  <body>
    <div class="selector-shell">
      <header class="selector-hero">
        <div>
          <p class="eyebrow">Parent and kid prototype</p>
          <h1>Neighborhood Nature Challenges</h1>
          <p class="selector-copy" id="statusText">Loading challenge packs.</p>
        </div>
        <div class="hero-actions">
          <a class="ghost-link" id="heroAdultLink" href="collect.html">Open adult mode</a>
          <a class="ghost-link" id="heroKidLink" href="kid-collect.html">Open kid mode</a>
          <a class="ghost-link" href="atlas.html">Open legacy atlas</a>
        </div>
        <p class="selector-status" id="lastPack"></p>
      </header>

      <main>
        <section class="pack-grid" id="packGrid" aria-label="Challenge packs"></section>
      </main>

      <footer class="selector-footer">
        <p>
          Use the same challenge on both devices before the walk. Adult mode is for progress, merge, and upload.
          Kid mode stays lighter and photo-first.
        </p>
      </footer>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="register-offline.js"></script>
    <script type="module" src="challenge-select.js"></script>
  </body>
</html>
